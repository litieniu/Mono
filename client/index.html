<!DOCTYPE html>
<html lang="zh-CN" class="dark h-full antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="书写代码、设计与边缘计算的个人博客。在秩序与混沌的交界处，寻找属于自己的巨石碑。" />
    <meta name="theme-color" content="#0d1117" />

    <!-- Open Graph 默认标签（SPA 首次抓取时的兜底） -->
    <meta property="og:title" content="Monolith — 代码、设计与边缘计算" />
    <meta property="og:description" content="书写代码、设计与边缘计算的个人博客。在秩序与混沌的交界处，寻找属于自己的巨石碑。" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Monolith" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:image" content="/og-default.png" />

    <!-- Twitter Card 默认标签 -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Monolith — 代码、设计与边缘计算" />
    <meta name="twitter:description" content="书写代码、设计与边缘计算的个人博客。" />
    <meta name="twitter:image" content="/og-default.png" />

    <title>Monolith — 代码、设计与边缘计算</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate" type="application/rss+xml" title="Monolith RSS" href="/rss.xml" />

    <!-- Google Fonts：preconnect + 非阻塞加载，不阻塞首屏渲染 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@450;500;600;700&amp;family=Work+Sans:wght@400;500;600;700&amp;display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@450;500;600;700&amp;family=Work+Sans:wght@400;500;600;700&amp;display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@450;500;600;700&amp;family=Work+Sans:wght@400;500;600;700&amp;display=swap" /></noscript>

    <!-- 首屏加载占位样式 -->
    <style>
      #boot-splash{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#0d1117;transition:opacity .3s ease}
      #boot-splash.is-done{opacity:0;pointer-events:none}
      #boot-splash .mono-word{font:700 22px/1 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;letter-spacing:.35em;text-indent:.35em;color:#e6edf3}
      #boot-splash .mono-spin{width:30px;height:30px;border-radius:50%;border:3px solid #30363d;border-top-color:#58a6ff;animation:mono-spin .9s linear infinite}
      @keyframes mono-spin{to{transform:rotate(360deg)}}
      html[data-theme="light"] #boot-splash{background:#ffffff}
      html[data-theme="light"] #boot-splash .mono-word{color:#1f2328}
      html[data-theme="light"] #boot-splash .mono-spin{border-color:#d0d7de;border-top-color:#0969da}
      html[data-style="fluid"] #boot-splash{background:#0d0b1a}
      html[data-style="fluid"][data-theme="light"] #boot-splash{background:#f6f4fb}
    </style>
  </head>
  <body class="min-h-full flex flex-col font-sans bg-background text-foreground">
    <!-- 主题初始化：在 React 加载前设置 data-theme / data-style，防止闪烁 -->
    <script>
      (function(){
        // 全站主题由控制台「站点配置 → 主题外观」决定；cookie 为首屏同步缓存，
        // 首次访问在公共设置加载前按默认暗色渲染，设置加载后立即校正并写入缓存。
        var mode = 'dark', style = 'default';
        var m = document.cookie.match(/(?:^|;\s*)monolith_site_theme=([^;]+)/);
        if (m) {
          try {
            var parts = decodeURIComponent(m[1]).split('|');
            if (['dark','light','system'].indexOf(parts[0]) >= 0) mode = parts[0];
            if (['default','fluid'].indexOf(parts[1]) >= 0) style = parts[1];
          } catch (e) {}
        }
        var d = mode === 'system'
          ? (window.matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light')
          : mode;
        document.documentElement.setAttribute('data-theme', d);
        document.documentElement.setAttribute('data-style', style);
        // 同步 theme-color
        var mc = document.querySelector('meta[name="theme-color"]');
        if (mc) {
          mc.setAttribute('content', style === 'fluid'
            ? (d === 'light' ? '#f6f4fb' : '#0d0b1a')
            : (d === 'light' ? '#ffffff' : '#0d1117'));
        }
        // 清理旧版访客本地主题偏好（主题已改为控制台全站设置）
        try {
          localStorage.removeItem('theme');
          localStorage.removeItem('monolith-theme-style');
        } catch (e) {}
      })();
    </script>
    <div id="root" class="min-h-screen flex flex-col"></div>
    <!-- 首屏加载占位：JS 包下载/解析期间显示；结束条件由 React 监听首屏渲染完成后移除（见 app.tsx dismissBootSplash），消除动画消失与内容呈现之间的断档 -->
    <div id="boot-splash" aria-hidden="true">
      <div class="mono-word">MONOLITH</div>
      <div class="mono-spin"></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
